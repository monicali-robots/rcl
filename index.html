<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Contact Lab</title>
<link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header>
    <div class="container">
        <nav>
            <div class="logo">Robot Contact Lab</div>

            <ul class="nav-links">
                <li><a href="#about">About</a></li>
                <li><a href="#publications">Publications</a></li>
                <li><a href="#team">Team</a></li>
                <li><a href="#news">News</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </div>
</header>

<section class="hero">
    <div class="container hero-content">
        <h1>Robot Contact Lab</h1>

        <p>
            We develop robotic systems that intelligently interact
            with the physical world through touch, manipulation,
            sensing, and mechanical design.
        </p>

        <a href="#about" class="button">Learn More</a>
    </div>
</section>

<!-- About Section -->
<div id="about-section"></div>

<!-- News Section -->
<div id="news-section"></div>

<!-- Team Section -->
<div id="team-section"></div>

<!-- Publications Section -->
<div id="publications-section"></div>

<!-- Contact Section -->
<div id="contact-section"></div>

<footer>
    © 2026 Robot Contact Lab • University of Washington
</footer>

<script>
    // Load section files
    async function loadSection(sectionId, filePath) {
        try {
            const response = await fetch(filePath);
            const html = await response.text();
            document.getElementById(sectionId).innerHTML = html;
        } catch (error) {
            console.error(`Error loading ${filePath}:`, error);
        }
    }

    // Load all sections
    loadSection('about-section', 'sections/about.html');
    loadSection('news-section', 'sections/news.html');
    loadSection('team-section', 'sections/team.html');
    loadSection('publications-section', 'sections/publications.html');
    loadSection('contact-section', 'sections/contact.html');
</script>

</body>
</html>
