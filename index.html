<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Contact Lab</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  html {
    scroll-behavior: smooth;
  }
</style>
</head>

<body>

<header>
    <div class="container">
        <nav>
            <div class="logo">Robot Contact Lab</div>

            <ul class="nav-links">
                <li><a href="#about">About</a></li>
                <li><a href="#news">News</a></li>
                <li><a href="#team">Team</a></li>
                <li><a href="#publications">Publications</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </div>
</header>

<section class="hero">
    <div class="container hero-content">
        <h1>Robot Contact Lab</h1>

        <p>
            <!--
            We develop robotic systems that intelligently interact
            with the physical world through touch, manipulation,
            sensing, and mechanical design.
            -->
        </p>

        <a href="#about-section" class="button">Learn More</a>
    </div>
</section>

<div id="about-section"></div>
<div id="news-section"></div>
<div id="team-section"></div>
<div id="publications-section"></div>
<div id="contact-section"></div>

<footer>
    © 2026 Monica Li <!--Robot Contact Lab • University of Washington -->
</footer>

<script>
async function loadSection(targetId, filePath) {
  try {
    const response = await fetch(filePath);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const html = await response.text();
    document.getElementById(targetId).innerHTML = html;
  } catch (error) {
    console.error(`Failed to load ${filePath}:`, error);
    document.getElementById(targetId).innerHTML = '<section class="container"><p>Section failed to load.</p></section>';
  }
}

loadSection('about-section', 'sections/about.html');
loadSection('news-section', 'sections/news.html');
loadSection('team-section', 'sections/team.html');
loadSection('publications-section', 'sections/publications.html');
loadSection('contact-section', 'sections/contact.html');
</script>

</body>
</html>
